dependencies:
  idf: ">=6.1"
  espressif/esp_lvgl_port:
    version: "^2"
    override_path: "../components/esp_lvgl_port"
  lvgl/lvgl: ">=9.6.0,<10.0.0"
  espressif/esp_hosted: "3.0.10"
  espressif/esp_wifi_remote: "^1.6.4"
  espressif/usb_host_uac:
    version: "1.5.0"
    # Local copy of the class driver: its uac_host_device_open() error path
    # dereferenced a NULL interface (and used a freed one) when a device left the
    # bus, which rebooted the Tab5. Managed components are generated, so the fix
    # has to live in the workspace.
    override_path: "../components/usb_host_uac"
  espressif/cjson: "^1.7.19"
  david-cermak/libssh: "*"
  # Replace libssh's transitive espressif/sock_utils dependency with the
  # maintained dual-stack implementation in the application workspace.
  sock_utils:
    version: "*"
    override_path: "../components/sock_utils"
  # Keep the pinned codec package local so its I2S/open/close error handling can
  # be corrected without mutating generated managed_components.
  espressif/esp_codec_dev:
    version: "1.6.2"
    override_path: "../components/esp_codec_dev"

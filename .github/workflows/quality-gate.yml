name: Quality Gate

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (immutable commit)
      - name: Install host quality tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cppcheck pipx
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pipx install 'clang-format==23.1.3'
          pipx install 'gcovr==8.7'
          pipx install 'ruff==0.17.1'
          pipx install 'bandit==1.9.4'
      - name: Format C++ and Python
        run: |
          clang-format --version
          # The adapter predates this gate and intentionally retains its
          # existing layout; check every changed production range.
          clang-format --dry-run --Werror \
            --lines=175:175 \
            --lines=277:293 \
            --lines=613:619 \
            --lines=771:772 \
            --lines=796:796 \
            --lines=891:894 \
            --lines=928:929 \
            components/cyberdeck/src/apps/bluetooth/ble_mgr.cpp
          clang-format --dry-run --Werror \
            --lines=9:15 \
            components/cyberdeck/include/apps/shell/cyberdeck_cat_worker.h
          clang-format --dry-run --Werror \
            --lines=3:8 \
            components/cyberdeck/src/apps/shell/cyberdeck_cat_worker.cpp
          clang-format --dry-run --Werror \
            components/cyberdeck/src/apps/system/cyberdeck_time_sync.cpp
          clang-format --dry-run --Werror \
            components/cyberdeck/include/apps/network/cyberdeck_netdiag_app.h \
            components/cyberdeck/include/apps/network/cyberdeck_netdiag_controller.h \
            components/cyberdeck/include/apps/network/cyberdeck_netdiag_dns_adapter.h \
            components/cyberdeck/include/apps/network/cyberdeck_netdiag_https_adapter.h \
            components/cyberdeck/include/apps/network/cyberdeck_netdiag_tcp_adapter.h \
            components/cyberdeck/src/apps/network/cyberdeck_netdiag_app.cpp \
            components/cyberdeck/src/apps/network/cyberdeck_netdiag_controller.cpp \
            components/cyberdeck/src/apps/network/cyberdeck_netdiag_dns_adapter.cpp \
            components/cyberdeck/src/apps/network/cyberdeck_netdiag_https_adapter.cpp \
            components/cyberdeck/src/apps/network/cyberdeck_netdiag_tcp_adapter.cpp
          clang-format --dry-run --Werror \
            tests/host/keymap/test_netdiag_app.cpp \
            tests/host/keymap/test_netdiag_controller.cpp \
            tests/host/keymap/test_netdiag_dns_adapter.cpp \
            tests/host/keymap/test_netdiag_https_adapter.cpp \
            tests/host/keymap/test_netdiag_tcp_adapter.cpp \
            tests/host/keymap/netdiag_app_shim/esp_timer.h \
            tests/host/keymap/netdiag_app_shim/esp_netif.h \
            tests/host/keymap/netdiag_app_shim/esp_wifi.h \
            tests/host/keymap/netdiag_app_shim/apps/wifi/wifi_mgr.h \
            tests/host/keymap/netdiag_app_shim/freertos/FreeRTOS.h \
            tests/host/keymap/netdiag_app_shim/freertos/idf_additions.h \
            tests/host/keymap/netdiag_app_shim/freertos/semphr.h \
            tests/host/keymap/netdiag_app_shim/freertos/task.h \
            tests/host/keymap/netdiag_app_shim/lwip/dns.h \
            tests/host/keymap/netdiag_app_shim/lwip/inet.h \
            tests/host/keymap/netdiag_app_shim/lwip/ip4_addr.h \
            tests/host/keymap/netdiag_app_shim/lwip/ip_addr.h \
            tests/host/keymap/netdiag_app_shim/lwip/tcpip.h \
            tests/host/keymap/netdiag_dns_shim/esp_timer.h \
            tests/host/keymap/netdiag_dns_shim/freertos/FreeRTOS.h \
            tests/host/keymap/netdiag_dns_shim/freertos/task.h \
            tests/host/keymap/netdiag_dns_shim/lwip/dns.h \
            tests/host/keymap/netdiag_dns_shim/lwip/ip4_addr.h \
            tests/host/keymap/netdiag_dns_shim/lwip/ip_addr.h \
            tests/host/keymap/netdiag_dns_shim/lwip/tcpip.h \
            tests/host/keymap/netdiag_https_shim/esp_crt_bundle.h \
            tests/host/keymap/netdiag_https_shim/esp_http_client.h \
            tests/host/keymap/netdiag_https_shim/esp_timer.h \
            tests/host/keymap/netdiag_https_shim/freertos/task.h \
            tests/host/keymap/netdiag_tcp_shim/esp_timer.h \
            tests/host/keymap/netdiag_tcp_shim/lwip/inet.h \
            tests/host/keymap/netdiag_tcp_shim/lwip/sockets.h
          clang-format --dry-run --Werror \
            components/cyberdeck/include/platform/storage/cyberdeck_sd_io_coordinator.h \
            components/cyberdeck/src/platform/storage/cyberdeck_sd_io_coordinator.cpp
          clang-format --dry-run --Werror \
            components/cyberdeck/include/apps/wifi/cyberdeck_wifi_survey_export_controller.h \
            components/cyberdeck/src/apps/wifi/cyberdeck_wifi_survey_export_controller.cpp \
            tests/host/keymap/test_wifi_survey_export_controller.cpp
          clang-format --dry-run --Werror \
            components/cyberdeck/include/apps/music/cyberdeck_music_metadata.h \
            components/cyberdeck/src/apps/music/cyberdeck_music_metadata.cpp
          # The music player/view TUs predate this gate and intentionally
          # retain their existing layout, and the music test TUs keep the
          # repository's CHECK macro layout; only the new session-duration
          # files are checked here.
          clang-format --dry-run --Werror \
            components/cyberdeck/include/apps/music/cyberdeck_music_duration.h \
            components/cyberdeck/src/apps/music/cyberdeck_music_duration.cpp
          # F is the repository's deterministic Python syntax/import-format
          # check; the existing CLI intentionally retains its broader legacy
          # whitespace style outside this gate.
          ruff check --select F tools
      - name: Lint, smells, and security
        run: |
          cppcheck --enable=warning,performance,portability \
            --error-exitcode=1 --suppress=missingIncludeSystem \
            components/cyberdeck/src/apps/bluetooth/cyberdeck_ble_*.cpp \
            components/cyberdeck/src/apps/system/cyberdeck_time_sync.cpp
          bandit -r tools -ll
      - name: Host aggregate and coverage
        id: host-coverage
        working-directory: tests/host/keymap
        run: |
          set -o pipefail
          make clean
          # The aggregate is the executable host scope. Remove every coverage
          # sidecar in this worktree before compiling and running it.
          rm -f -- ./*.gcda ./*.gcno
          make CXXFLAGS='-std=c++17 -Wall -Wextra -Werror -O0 --coverage' \
            test
          echo '### Global host coverage (compiled/tested production C++)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Coverage gates: >=80% lines, >=90% functions, >=50% branches.' >> "$GITHUB_STEP_SUMMARY"
          GCOVR_ARGS=(
            --root ../../..
            --filter '../../../components/cyberdeck/src/.*\.cpp'
            --txt-metric branch
            --json "$RUNNER_TEMP/cyberdeck-coverage.json"
            --fail-under-line 80
            --fail-under-function 90
            --fail-under-branch 50
            --print-summary
          )
          gcovr "${GCOVR_ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 ../../../tools/coverage_scope_guard.py \
            --root ../../.. \
            --source-root ../../../components/cyberdeck/src \
            --gcovr-json "$RUNNER_TEMP/cyberdeck-coverage.json"
      - name: App grant concurrency test (ThreadSanitizer)
        id: app-grant-tsan
        working-directory: tests/host/keymap
        run: make test_app_runtime_tsan
      - uses: espressif/install-esp-idf-action@8fc05d1470d5591417e7a3707a1f2bec178db4ae # branch v1 tip (immutable commit)
        with:
          version: v6.1
      - name: Prepare ESP-Hosted CPU-staging
        id: hosted-staging
        run: |
          # managed_components/ is gitignored, so the pinned ESP-Hosted sources
          # only exist after a CMake configure downloads them. That is why the
          # patch is applied after this warm-up configure and not before it: the
          # warm-up materializes the component, then the real patch is applied
          # so the fail-closed verify in CMakeLists.txt stays enabled.
          warmup_log="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/hosted-warmup.log"
          if idf.py -B build-warmup reconfigure > "$warmup_log" 2>&1; then
            warmup_status=0
          else
            warmup_status=$?
          fi
          if [ "$warmup_status" -ne 0 ]; then
            # Tolerate the warm-up rc only for the expected staging error, and
            # only when the component was actually downloaded; any other
            # failure must abort with its log.
            if [ ! -d managed_components/espressif__esp_hosted ] \
              || ! grep -q 'ESP-Hosted CPU-staging is missing or changed' "$warmup_log"; then
              cat "$warmup_log"
              echo "Warm-up configure failed for an unexpected reason (rc=$warmup_status)." >&2
              exit 1
            fi
            python3 tools/prepare_esp_hosted_cpu_staging.py apply
          fi
          python3 tools/prepare_esp_hosted_cpu_staging.py verify
          rm -rf build-warmup
      - name: Verify LVGL symbol code point map
        id: lv-symbol-drift
        working-directory: tests/host/keymap
        run: |
          # The aggregate host run happens before the ESP-IDF warm-up, so the
          # contract resolves `LV_SYMBOL_*` from the versioned
          # lv_symbol_codepoints.json. Here managed_components/ exists, so the
          # map is re-parsed against the pinned lv_symbol_def.h and any drift
          # fails the gate. The strict variant fails when the header is absent,
          # so a warm-up that did not materialize managed_components/ cannot
          # leave this step green without actually checking drift.
          make verify_lv_symbol_codepoints_strict
      - name: Build firmware
        id: firmware-build
        run: |
          idf.py build
          python3 tools/poweroff_link_guard.py --map build/cyberdeck5.map
      - name: Job summary
        if: always()
        run: |
          {
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo '| ESP-Hosted CPU-staging | ${{ steps.hosted-staging.outcome }} |'
            echo '| ESP-IDF 6.1 build | ${{ steps.firmware-build.outcome }} |'
            echo '| LVGL symbol map drift (strict) | ${{ steps.lv-symbol-drift.outcome }} |'
            echo '| Host aggregate and coverage | ${{ steps.host-coverage.outcome }} |'
            echo '| App grant ThreadSanitizer | ${{ steps.app-grant-tsan.outcome }} |'
            echo '| Global host C++ coverage | line >=80%; functions >=90%; branches >=50% |'
            echo '| Coverage scope | fail-closed gcovr JSON guard; explicit hardware allowlist only |'
          } >> "$GITHUB_STEP_SUMMARY"

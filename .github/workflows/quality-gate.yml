name: Quality Gate

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (immutable commit)
      - name: Install host quality tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cppcheck pipx
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pipx install 'clang-format==23.1.3'
          pipx install 'gcovr==8.7'
          pipx install 'ruff==0.17.1'
          pipx install 'bandit==1.9.4'
      - name: Format C++ and Python
        run: |
          clang-format --version
          # The adapter predates this gate and intentionally retains its
          # existing layout; check every changed production range.
          clang-format --dry-run --Werror \
            --lines=175:175 \
            --lines=277:293 \
            --lines=613:619 \
            --lines=771:772 \
            --lines=796:796 \
            --lines=891:894 \
            --lines=928:929 \
            components/cyberdeck/src/apps/bluetooth/ble_mgr.cpp
          clang-format --dry-run --Werror \
            --lines=9:15 \
            components/cyberdeck/include/apps/shell/cyberdeck_cat_worker.h
          clang-format --dry-run --Werror \
            --lines=3:8 \
            components/cyberdeck/src/apps/shell/cyberdeck_cat_worker.cpp
          clang-format --dry-run --Werror \
            components/cyberdeck/src/apps/system/cyberdeck_time_sync.cpp
          clang-format --dry-run --Werror \
            components/cyberdeck/include/apps/network/cyberdeck_netdiag_app.h \
            components/cyberdeck/include/apps/network/cyberdeck_netdiag_controller.h \
            components/cyberdeck/include/apps/network/cyberdeck_netdiag_dns_adapter.h \
            components/cyberdeck/include/apps/network/cyberdeck_netdiag_https_adapter.h \
            components/cyberdeck/include/apps/network/cyberdeck_netdiag_tcp_adapter.h \
            components/cyberdeck/src/apps/network/cyberdeck_netdiag_app.cpp \
            components/cyberdeck/src/apps/network/cyberdeck_netdiag_controller.cpp \
            components/cyberdeck/src/apps/network/cyberdeck_netdiag_dns_adapter.cpp \
            components/cyberdeck/src/apps/network/cyberdeck_netdiag_https_adapter.cpp \
            components/cyberdeck/src/apps/network/cyberdeck_netdiag_tcp_adapter.cpp
          clang-format --dry-run --Werror \
            tests/host/keymap/test_netdiag_app.cpp \
            tests/host/keymap/test_netdiag_controller.cpp \
            tests/host/keymap/test_netdiag_dns_adapter.cpp \
            tests/host/keymap/test_netdiag_https_adapter.cpp \
            tests/host/keymap/test_netdiag_tcp_adapter.cpp \
            tests/host/keymap/netdiag_app_shim/esp_timer.h \
            tests/host/keymap/netdiag_app_shim/esp_netif.h \
            tests/host/keymap/netdiag_app_shim/esp_wifi.h \
            tests/host/keymap/netdiag_app_shim/apps/wifi/wifi_mgr.h \
            tests/host/keymap/netdiag_app_shim/freertos/FreeRTOS.h \
            tests/host/keymap/netdiag_app_shim/freertos/idf_additions.h \
            tests/host/keymap/netdiag_app_shim/freertos/semphr.h \
            tests/host/keymap/netdiag_app_shim/freertos/task.h \
            tests/host/keymap/netdiag_app_shim/lwip/dns.h \
            tests/host/keymap/netdiag_app_shim/lwip/inet.h \
            tests/host/keymap/netdiag_app_shim/lwip/ip4_addr.h \
            tests/host/keymap/netdiag_app_shim/lwip/ip_addr.h \
            tests/host/keymap/netdiag_app_shim/lwip/tcpip.h \
            tests/host/keymap/netdiag_dns_shim/esp_timer.h \
            tests/host/keymap/netdiag_dns_shim/freertos/FreeRTOS.h \
            tests/host/keymap/netdiag_dns_shim/freertos/task.h \
            tests/host/keymap/netdiag_dns_shim/lwip/dns.h \
            tests/host/keymap/netdiag_dns_shim/lwip/ip4_addr.h \
            tests/host/keymap/netdiag_dns_shim/lwip/ip_addr.h \
            tests/host/keymap/netdiag_dns_shim/lwip/tcpip.h \
            tests/host/keymap/netdiag_https_shim/esp_crt_bundle.h \
            tests/host/keymap/netdiag_https_shim/esp_http_client.h \
            tests/host/keymap/netdiag_https_shim/esp_timer.h \
            tests/host/keymap/netdiag_https_shim/freertos/task.h \
            tests/host/keymap/netdiag_tcp_shim/esp_timer.h \
            tests/host/keymap/netdiag_tcp_shim/lwip/inet.h \
            tests/host/keymap/netdiag_tcp_shim/lwip/sockets.h
          clang-format --dry-run --Werror \
            components/cyberdeck/include/platform/storage/cyberdeck_sd_io_coordinator.h \
            components/cyberdeck/src/platform/storage/cyberdeck_sd_io_coordinator.cpp
          # Tab completion is new code: the whole shell-completion module, its
          # display-task post port and the focused test stay inside this gate so
          # a future unformatted change cannot ship unnoticed.
          clang-format --dry-run --Werror \
            components/cyberdeck/include/apps/shell/cyberdeck_shell_completion.h \
            components/cyberdeck/src/apps/shell/cyberdeck_shell_completion_scan.cpp \
            components/cyberdeck/include/apps/shell/cyberdeck_completion_worker.h \
            components/cyberdeck/src/apps/shell/cyberdeck_completion_worker.cpp \
            components/cyberdeck/include/platform/display/cyberdeck_ui_post.h \
            components/cyberdeck/src/platform/display/cyberdeck_ui_post.cpp \
            tests/host/keymap/test_shell_completion.cpp
          # The M5Stack keyboard TUs predate this gate and intentionally retain
          # their existing layout; only the ranges touched by the physical Tab
          # token fix are checked (same delimiting rule used for ble_mgr.cpp).
          clang-format --dry-run --Werror \
            --lines=126:143 \
            components/cyberdeck/src/platform/input/tab5_keyboard.cpp
          clang-format --dry-run --Werror \
            --lines=33:34 \
            components/cyberdeck/src/platform/input/tab5_keyboard_keys.cpp
          clang-format --dry-run --Werror \
            components/cyberdeck/include/apps/wifi/cyberdeck_wifi_survey_export_controller.h \
            components/cyberdeck/src/apps/wifi/cyberdeck_wifi_survey_export_controller.cpp \
            tests/host/keymap/test_wifi_survey_export_controller.cpp
          clang-format --dry-run --Werror \
            components/cyberdeck/include/apps/music/cyberdeck_music_metadata.h \
            components/cyberdeck/src/apps/music/cyberdeck_music_metadata.cpp
          # The music player/view TUs predate this gate and intentionally
          # retain their existing layout, and the music test TUs keep the
          # repository's CHECK macro layout; only the new session-duration
          # files are checked here.
          clang-format --dry-run --Werror \
            components/cyberdeck/include/apps/music/cyberdeck_music_duration.h \
            components/cyberdeck/src/apps/music/cyberdeck_music_duration.cpp
          # The browser is new code; keep legacy music player/view TUs outside
          # this gate while checking its production API, implementation, and test.
          clang-format --dry-run --Werror \
            components/cyberdeck/include/apps/music/cyberdeck_music_browser.h \
            components/cyberdeck/src/apps/music/cyberdeck_music_browser.cpp \
            tests/host/keymap/test_music_browser.cpp
          # The authenticated upload transport and the image viewer are new
          # code; their production headers/sources and test TUs stay inside
          # the format gate so the omission that shipped unformatted files
          # cannot happen again.  Vendored third_party sources (miniz/TJpgDec)
          # are upstream copies and are deliberately not reformatted here;
          # their provenance is checked by test_image_decoders_contract.
          clang-format --dry-run --Werror \
            components/cyberdeck/include/apps/control/cyberdeck_control_upload.h \
            components/cyberdeck/src/apps/control/cyberdeck_control_upload.cpp \
            components/cyberdeck/include/apps/image/cyberdeck_image_app.h \
            components/cyberdeck/include/apps/image/cyberdeck_image_bmp.h \
            components/cyberdeck/include/apps/image/cyberdeck_image_decode.h \
            components/cyberdeck/include/apps/image/cyberdeck_image_fit.h \
            components/cyberdeck/include/apps/image/cyberdeck_image_formats.h \
            components/cyberdeck/include/apps/image/cyberdeck_image_jpeg.h \
            components/cyberdeck/include/apps/image/cyberdeck_image_list.h \
            components/cyberdeck/include/apps/image/cyberdeck_image_navigation.h \
            components/cyberdeck/include/apps/image/cyberdeck_image_png.h \
            components/cyberdeck/include/apps/image/cyberdeck_image_types.h \
            components/cyberdeck/include/apps/image/cyberdeck_image_worker_state.h \
            components/cyberdeck/src/apps/image/cyberdeck_image_app.cpp \
            components/cyberdeck/src/apps/image/cyberdeck_image_bmp.cpp \
            components/cyberdeck/src/apps/image/cyberdeck_image_decode.cpp \
            components/cyberdeck/src/apps/image/cyberdeck_image_fit.cpp \
            components/cyberdeck/src/apps/image/cyberdeck_image_formats.cpp \
            components/cyberdeck/src/apps/image/cyberdeck_image_jpeg.cpp \
            components/cyberdeck/src/apps/image/cyberdeck_image_list.cpp \
            components/cyberdeck/src/apps/image/cyberdeck_image_navigation.cpp \
            components/cyberdeck/src/apps/image/cyberdeck_image_png.cpp \
            components/cyberdeck/src/apps/image/cyberdeck_image_source.h \
            components/cyberdeck/src/apps/image/cyberdeck_image_worker_state.cpp \
            components/cyberdeck/include/platform/display/cyberdeck_image_view.h \
            components/cyberdeck/src/platform/display/cyberdeck_image_view.cpp \
            tests/host/keymap/test_control_upload_protocol.cpp \
            tests/host/keymap/test_image_bmp.cpp \
            tests/host/keymap/test_image_capture_orientation.cpp \
            tests/host/keymap/test_image_decode.cpp \
            tests/host/keymap/test_image_fit.cpp \
            tests/host/keymap/test_image_formats.cpp \
            tests/host/keymap/test_image_jpeg.cpp \
            tests/host/keymap/test_image_list.cpp \
            tests/host/keymap/test_image_navigation.cpp \
            tests/host/keymap/test_image_png.cpp \
            tests/host/keymap/test_image_view.cpp \
            tests/host/keymap/test_image_worker_state.cpp
          # F is the repository's deterministic Python syntax/import-format
          # check; the existing CLI intentionally retains its broader legacy
          # whitespace style outside this gate.
          ruff check --select F tools
          # The shell-session structural contract is new Python code, so it is
          # checked here instead of relying on the host aggregate to execute it
          # later: the formatter pins its layout and the same F selector catches
          # syntax/undefined-name regressions.  Legacy Python tests keep their
          # broader whitespace style outside this gate.
          ruff format --check tests/host/keymap/test_shell_session_contract.py
          ruff check --select F tests/host/keymap/test_shell_session_contract.py
      - name: Lint, smells, and security
        run: |
          cppcheck --enable=warning,performance,portability \
            --error-exitcode=1 --suppress=missingIncludeSystem \
            components/cyberdeck/src/apps/bluetooth/cyberdeck_ble_*.cpp \
            components/cyberdeck/src/apps/system/cyberdeck_time_sync.cpp
          # The image decoders/navigation model are new first-party C++ and stay
          # under the same warning/performance/portability bar.  The suppression
          # only covers cppcheck's aggregate false positive
          # (uninitMemberVarNoCtor) for structs whose members are initialized at
          # every aggregate construction (`extension_entry`, `chunk_walk`).
          # Vendored third_party sources (miniz/TJpgDec) stay out on purpose:
          # they are unmodified upstream copies and their provenance is checked
          # by test_image_decoders_contract, not by project lint.
          cppcheck --enable=warning,performance,portability \
            --error-exitcode=1 --suppress=missingIncludeSystem \
            --suppress=uninitMemberVarNoCtor \
            components/cyberdeck/src/apps/image/cyberdeck_image_formats.cpp \
            components/cyberdeck/src/apps/image/cyberdeck_image_jpeg.cpp \
            components/cyberdeck/src/apps/image/cyberdeck_image_png.cpp \
            components/cyberdeck/src/apps/image/cyberdeck_image_navigation.cpp
          cppcheck --enable=warning,performance,portability \
            --error-exitcode=1 --suppress=missingIncludeSystem \
            components/cyberdeck/src/apps/shell/cyberdeck_shell_completion_scan.cpp \
            components/cyberdeck/src/apps/shell/cyberdeck_completion_worker.cpp \
            components/cyberdeck/src/platform/display/cyberdeck_ui_post.cpp \
            components/cyberdeck/src/platform/input/tab5_keyboard.cpp \
            components/cyberdeck/src/platform/input/tab5_keyboard_keys.cpp
          bandit -r tools -ll
      - name: App grant concurrency test (ThreadSanitizer)
        id: app-grant-tsan
        working-directory: tests/host/keymap
        run: make test_app_runtime_tsan
      - uses: espressif/install-esp-idf-action@8fc05d1470d5591417e7a3707a1f2bec178db4ae # branch v1 tip (immutable commit)
        with:
          version: v6.1
      - name: Prepare ESP-Hosted CPU-staging
        id: hosted-staging
        run: |
          # managed_components/ is gitignored, so the pinned ESP-Hosted sources
          # only exist after a CMake configure downloads them. That is why the
          # patch is applied after this warm-up configure and not before it: the
          # warm-up materializes the component, then the real patch is applied
          # so the fail-closed verify in CMakeLists.txt stays enabled.
          warmup_log="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/hosted-warmup.log"
          if idf.py -B build-warmup reconfigure > "$warmup_log" 2>&1; then
            warmup_status=0
          else
            warmup_status=$?
          fi
          if [ "$warmup_status" -ne 0 ]; then
            # Tolerate the warm-up rc only for the expected staging error, and
            # only when the component was actually downloaded; any other
            # failure must abort with its log.
            if [ ! -d managed_components/espressif__esp_hosted ] \
              || ! grep -q 'ESP-Hosted CPU-staging is missing or changed' "$warmup_log"; then
              cat "$warmup_log"
              echo "Warm-up configure failed for an unexpected reason (rc=$warmup_status)." >&2
              exit 1
            fi
            python3 tools/prepare_esp_hosted_cpu_staging.py apply
          fi
          python3 tools/prepare_esp_hosted_cpu_staging.py verify
          rm -rf build-warmup
      - name: Verify LVGL symbol code point map
        id: lv-symbol-drift
        working-directory: tests/host/keymap
        run: |
          # The strict variant re-parses the map against the pinned
          # lv_symbol_def.h in managed_components and fails when the header is
          # absent, so a warm-up that did not materialize managed_components/
          # cannot leave this step green without actually checking drift.
          make verify_lv_symbol_codepoints_strict
      - name: Build firmware
        id: firmware-build
        run: |
          idf.py build
          python3 tools/poweroff_link_guard.py --map build/cyberdeck5.map
      - name: Host aggregate and coverage
        id: host-coverage
        working-directory: tests/host/keymap
        run: |
          set -o pipefail
          # This step runs after the ESP-IDF setup on purpose: the aggregate
          # includes test_image_stack_frame_contract, which is fail-closed on a
          # current build/cyberdeck5.elf and on the RISC-V nm/objdump.  The ESP
          # toolchain must not shadow the host binutils (its `as` rejects the
          # host flags), so the host PATH is built first and the toolchain bin
          # dirs discovered by idf_tools.py are appended *after* the host bins.
          # The runner's toolchain may live outside ~/.espressif, so the dirs are
          # resolved from `idf_tools.py export` (the same install the build
          # used) instead of a fixed glob.  Both requirements are fail-closed:
          # /usr/bin/as must win and riscv32-esp-elf-nm must still resolve.
          IDF_TOOLS_PY="${IDF_PATH:-}/tools/idf_tools.py"
          if [ ! -f "$IDF_TOOLS_PY" ] && command -v idf.py >/dev/null 2>&1; then
            IDF_TOOLS_PY="$(dirname "$(command -v idf.py)")/idf_tools.py"
          fi
          if [ ! -f "$IDF_TOOLS_PY" ]; then
            echo "IDF tool exporter not found (IDF_PATH=${IDF_PATH:-unset})" >&2
            exit 1
          fi
          CROSS_BIN_DIRS=""
          # The exporter is only a probe: a non-zero status must never abort the
          # host step before the fallbacks/guards (it did in run 42703506289).
          # Capture stderr and status for diagnosis, then fall back to the
          # installed toolchain roots and finally to command -v.
          IDF_PYTHON="${IDF_PYTHON_ENV_PATH:-}/bin/python"
          if [ ! -x "$IDF_PYTHON" ]; then
            IDF_PYTHON=python3
          fi
          IDF_EXPORT_ERR="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/idf-tools-export.err"
          IDF_EXPORT_PATH=""
          IDF_EXPORT_STATUS=0
          IDF_EXPORT_PATH=$("$IDF_PYTHON" "$IDF_TOOLS_PY" export --format key-value 2>"$IDF_EXPORT_ERR" \
            | sed -n 's/^PATH=//p') || IDF_EXPORT_STATUS=$?
          if [ "$IDF_EXPORT_STATUS" -ne 0 ]; then
            echo "idf_tools.py export failed (status=$IDF_EXPORT_STATUS); using installed tool dirs" >&2
            sed -n '1,10p' "$IDF_EXPORT_ERR" >&2 || true
            IDF_EXPORT_PATH=""
          fi
          IFS=':' read -r -a idf_path_entries <<< "$IDF_EXPORT_PATH"
          for entry in "${idf_path_entries[@]}"; do
            case "$entry" in
              *riscv32-esp-elf*/riscv32-esp-elf/bin) CROSS_BIN_DIRS="${CROSS_BIN_DIRS:+$CROSS_BIN_DIRS:}$entry" ;;
            esac
          done
          HOST_PATH=""
          IFS=':' read -r -a path_entries <<< "$PATH"
          for entry in "${path_entries[@]}"; do
            case "$entry" in
              */.espressif/*|*/esp/esp-idf/*|*riscv32-esp-elf*) continue ;;
            esac
            HOST_PATH="${HOST_PATH:+$HOST_PATH:}$entry"
          done
          if [ -z "$CROSS_BIN_DIRS" ]; then
            # Installed toolchain roots: IDF_TOOLS_PATH on the runner and the
            # developer default ~/.espressif.
            for root in "${IDF_TOOLS_PATH:-}/tools" "${HOME:-}/.espressif/tools"; do
              for dir in "$root"/riscv32-esp-elf/*/riscv32-esp-elf/bin; do
                if [ -x "$dir/riscv32-esp-elf-nm" ]; then
                  CROSS_BIN_DIRS="${CROSS_BIN_DIRS:+$CROSS_BIN_DIRS:}$dir"
                fi
              done
            done
          fi
          if [ -z "$CROSS_BIN_DIRS" ]; then
            # Last resort for an install layout idf_tools.py does not report:
            # keep the directory of the nm/objdump already visible on PATH.
            for tool in riscv32-esp-elf-nm riscv32-esp-elf-objdump; do
              if resolved=$(command -v "$tool" 2>/dev/null); then
                CROSS_BIN_DIRS="${CROSS_BIN_DIRS:+$CROSS_BIN_DIRS:}$(dirname "$resolved")"
              fi
            done
          fi
          export PATH="${HOST_PATH}${CROSS_BIN_DIRS:+:$CROSS_BIN_DIRS}"
          HOST_AS=$(command -v as || true)
          CROSS_NM=$(command -v riscv32-esp-elf-nm || true)
          case "$HOST_AS" in
            /usr/bin/as|/bin/as) ;;
            *) echo "host assembler is not first in PATH: ${HOST_AS:-missing}" >&2; exit 1 ;;
          esac
          if [ -z "$CROSS_NM" ]; then
            echo "riscv32-esp-elf-nm not found after PATH setup" >&2
            exit 1
          fi
          echo "host as=$HOST_AS cross nm=$CROSS_NM"
          make clean
          # The aggregate is the executable host scope. Remove every coverage
          # sidecar in this worktree before compiling and running it.
          rm -f -- ./*.gcda ./*.gcno
          make CXXFLAGS='-std=c++17 -Wall -Wextra -Werror -O0 --coverage' \
            test
          echo '### Global host coverage (compiled/tested production C++)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Coverage gates: >=80% lines, >=90% functions, >=50% branches.' >> "$GITHUB_STEP_SUMMARY"
          GCOVR_ARGS=(
            --root ../../..
            --filter '../../../components/cyberdeck/src/.*\.cpp'
            --txt-metric branch
            --json "$RUNNER_TEMP/cyberdeck-coverage.json"
            --fail-under-line 80
            --fail-under-function 90
            --fail-under-branch 50
            --print-summary
          )
          gcovr "${GCOVR_ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 ../../../tools/coverage_scope_guard.py \
            --root ../../.. \
            --source-root ../../../components/cyberdeck/src \
            --gcovr-json "$RUNNER_TEMP/cyberdeck-coverage.json"
      - name: Job summary
        if: always()
        run: |
          {
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo '| ESP-Hosted CPU-staging | ${{ steps.hosted-staging.outcome }} |'
            echo '| ESP-IDF 6.1 build | ${{ steps.firmware-build.outcome }} |'
            echo '| LVGL symbol map drift (strict) | ${{ steps.lv-symbol-drift.outcome }} |'
            echo '| Host aggregate and coverage | ${{ steps.host-coverage.outcome }} |'
            echo '| App grant ThreadSanitizer | ${{ steps.app-grant-tsan.outcome }} |'
            echo '| Global host C++ coverage | line >=80%; functions >=90%; branches >=50% |'
            echo '| Coverage scope | fail-closed gcovr JSON guard; explicit hardware allowlist only |'
          } >> "$GITHUB_STEP_SUMMARY"
